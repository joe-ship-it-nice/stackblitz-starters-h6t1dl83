<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <title>I AM BORED</title>
<!-- Bootstrap CSS -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

  </head>
  <body>
    <!-- LOGIN PAGE -->
    <section id="login-section">
      <img src="favicon.png" alt="Bored Face"/>
      <h1 class="text-center mb-3">
        🥱 I am Bored 🥱
      </h1>
      <p class="text-center">
        No idea what to do? Come here!
      </p>

      <!-- Username -->
      <div class="mb-3">
        <label
          for="username"
          class="form-label"
        >
          Username
        </label>
        <input
          type="text"
          id="username"
          class="form-control"
          placeholder="Enter username"
        />
      </div>
      <!-- Password -->
      <div class="mb-3">
        <label
          for="password"
          class="form-label"
        >
          Password
        </label>
        <input
          type="password"
          id="password"
          class="form-control"
          placeholder="Enter password"
        />
      </div>

      <!-- Login button -->
      <button
        class="btn btn-primary w-100"
        onclick="login()"
      >
        ✨ Login
      </button>
      <!-- Login error message -->
      <p
        id="login-message"
        class="text-danger text-center mt-3"
      ></p>
    </section>


    <!-- DASHBOARD -->
    <main id="dashboard">
      <!-- Navbar -->
      <nav class="navbar navbar-dark">
        <div class="container">
          <span class="navbar-brand">
            I am bored 🥱
          </span>
          <button
            class="btn btn-light"
            onclick="logout()"
          >
            Logout
          </button>
        </div>
      </nav>

      <!-- Main content -->
      <div class="container mt-5">
        <div class="row">
          <!-- RANDOM ACTIVITY -->
          <div class="col-md-8 mb-4">
            <section
              id="activity-section"
              class="text-center"
            >
              <h2>
                🎀 What should I do today?
              </h2>

              <p class="text-secondary">
                Click the button and let us suggest something for you!
              </p>

              <!-- Random activity appears here -->
              <div id="activity">
                Your activity will appear here.
              </div>

              <!-- Buttons -->
              <div>
                <button
                  id="get-activity-button"
                  class="btn btn-primary btn-lg me-2"
                  onclick="getActivity()"
                >
                  ✨ Get Activity
                </button>
                <button
                  id="save-button"
                  class="btn btn-success btn-lg"
                  onclick="saveActivity()"
                  disabled
                >
                  💖 Save
                </button>
              </div>

              <!-- Messages -->
              <p
                id="activity-message"
                class="mt-3"
              ></p>
            </section>
          </div>

          <!-- SAVED ACTIVITIES -->
          <div class="col-md-4">
            <section id="saved-panel">
              <h3>
                💖 Saved Activities
              </h3>
              <p class="text-secondary">
                Your favourite ideas live here!
              </p>
              <!-- Saved activities appear here -->
              <ul id="saved-list"></ul>
              <!-- Displayed when list is empty -->
              <p
                id="empty-message"
                class="text-secondary"
              >
                🌷 No saved activities yet.
              </p>
            </section>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>

  </body>
</html>
